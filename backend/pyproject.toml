[project]
name = "alma"
version = "0.1.0"
description = "VIVARA - Adaptive Life Management Agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "networkx>=3.0",
    "anthropic>=0.85.0",
    "openai>=2.28.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "websockets>=13.0",
    "google-genai>=1.0.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.0",
    "cryptography>=46.0.7",
    "httpx>=0.27.0",
    "python-multipart>=0.0.27",
    "requests>=2.33.0",
    "urllib3>=2.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    # Exact pins. A linter's default rule set changes between releases, so
    # an unpinned dev tool silently makes CI and local disagree. CI installs
    # this extra, so these two lines are the only place versions are set.
    "ruff==0.15.6",
    "mypy==1.19.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

# Pin the rule set explicitly. With no `select`, ruff falls back to its
# built-in default, which grew from 59 rules (0.15.x) to 414 rules (0.16.x).
# These four are exactly that former default, so behaviour is unchanged.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

# Annotation completeness is a separate, larger job (160 no-untyped-def,
# 173 type-arg, 34 no-untyped-call, 14 no-any-return across src/). Turning
# those off keeps every *correctness* check strict, which is the part that
# finds bugs. Re-enable one code at a time as annotations get filled in.
disable_error_code = [
    "no-untyped-def",
    "type-arg",
    "no-untyped-call",
    "no-any-return",
]

# Third-party packages that ship no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = [
    "docx.*",
    "fitz.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "jose.*",
    "networkx.*",
    "pgvector.*",
    "pywebpush.*",
]
ignore_missing_imports = true
