name: ALMA CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main, feature/phase1-mvp]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      # Install the project so ruff/mypy come from pyproject's [dev] extra
      # (one source of truth for versions) and so mypy resolves real imports
      # instead of reporting every third-party package as missing.
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alma
          POSTGRES_PASSWORD: alma
          POSTGRES_DB: alma
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://alma:alma@localhost:5432/alma
      TEST_DATABASE_URL: postgresql+asyncpg://alma:alma@localhost:5432/alma
      JWT_SECRET: ci-test-secret
      # Fernet test key — encrypts only ephemeral CI test data; not a real secret
      ENCRYPTION_KEY: 75CM88xp7uxzd0tf2csdrVb9syrRfNBu4d-zzxLRkaU=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -v --cov=alma --cov-report=term-missing

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json is authored by npm 11; node 22 bundles npm 10,
      # which rejects it. Pin npm so the lockfile is read by its author.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json is authored by npm 11; node 22 bundles npm 10,
      # which rejects it. Pin npm so the lockfile is read by its author.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
